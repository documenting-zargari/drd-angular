<div class="position-relative">
  <input type="text" class="form-control"
         [ngModel]="value"
         [placeholder]="placeholder"
         [attr.autofocus]="autofocus ? true : null"
         (ngModelChange)="onInput($event)"
         (focus)="onFocus()"
         (blur)="onBlur()"
         (keyup.enter)="onEnter()"
         (keyup.escape)="onEscape()">
  <div class="list-group position-absolute w-100" style="z-index: 10; max-height: 12rem; overflow-y: auto;"
       *ngIf="showSuggestions">
    <button *ngFor="let s of suggestions" type="button"
            class="list-group-item list-group-item-action py-1 small d-flex justify-content-between align-items-center"
            (mousedown)="selectSuggestion(s)">
      <span>{{ s.value }}</span>
      <span class="badge text-bg-light text-muted flex-shrink-0 ms-2">{{ s.count }}</span>
    </button>
  </div>
</div>
