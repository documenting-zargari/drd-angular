<div *ngIf="loading" class="text-muted small py-2">
  <span class="spinner-border spinner-border-sm me-1" role="status"></span>Loading categories…
</div>
<div *ngIf="loadError" class="alert alert-warning py-2 px-3 mb-0 small">
  Couldn't load the category tree. Your session may have expired — try reloading the page.
</div>
<div *ngIf="!loading && !loadError && categories.length === 0" class="text-muted small py-2">
  No categories available.
</div>

<ul class="list-unstyled mb-0" *ngIf="!loading && !loadError">
  <li *ngFor="let c of getFlattenedCategories()" [style.margin-left.px]="c.level * 20" class="py-1">
    <button *ngIf="c.has_children" (click)="expandCategory(c)" class="btn btn-sm p-0 me-1" style="width: 1.2em;" type="button">
      <span *ngIf="isCategoryLoading(c)">⏳</span>
      <span *ngIf="!isCategoryLoading(c)">{{ isCategoryExpanded(c) ? '▼' : '▶' }}</span>
    </button>
    <span *ngIf="!c.has_children" class="d-inline-block me-1" style="width: 1.2em;"></span>

    <input type="checkbox" *ngIf="isSelectable(c)" class="me-1" [checked]="isSelected(c)" (change)="toggle(c)">
    <span *ngIf="!isSelectable(c)" class="d-inline-block me-1" style="width: 1em;"></span>

    <span *ngIf="selectableType === 'any' && isSelectable(c)" class="badge me-1"
          [class.text-bg-secondary]="c.is_leaf" [class.text-bg-light]="!c.is_leaf"
          style="font-size: 0.6em; vertical-align: middle;">
      {{ c.is_leaf ? 'Question' : 'Category' }}
    </span>

    <span (click)="isSelectable(c) ? toggle(c) : null" [class.fw-bold]="isSelected(c)" [class]="isSelectable(c) ? 'btn p-0' : ''">
      {{ c.name }}
    </span>
  </li>
</ul>
