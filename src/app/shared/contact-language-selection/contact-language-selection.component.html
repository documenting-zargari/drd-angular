<!-- Contact Language Selection Modal — mirrors app-country-selection -->
<div class="modal fade" [id]="modalId" tabindex="-1" aria-labelledby="contactLanguageModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header sticky-top bg-white">
        <h5 class="modal-title" id="contactLanguageModalLabel">Choose Contact Languages</h5>
        <button type="button" class="btn btn-secondary ms-auto" data-bs-dismiss="modal">Finished</button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">
          Limits the search to samples that list the language as a contact language (L2) at the chosen level.
          Several choices match samples having any of them.
        </p>
        <div class="row g-2 mb-3 align-items-center">
          <div class="col-md-6">
            <div class="btn-group btn-group-sm" role="group" aria-label="L2 level">
              <button *ngFor="let l of levels" type="button" class="btn btn-outline-secondary"
                      [class.bg-secondary-subtle]="level === l" (click)="setLevel(l)">{{ levelLabel(l) }}</button>
            </div>
          </div>
          <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Search languages..." [(ngModel)]="searchTerm">
          </div>
        </div>

        <div class="list-group" style="max-height: 400px; overflow-y: auto;">
          <div *ngFor="let row of filteredRows"
               class="list-group-item list-group-item-action d-flex align-items-center"
               (click)="toggle(row.language)" style="cursor: pointer;">
            <input type="checkbox" class="form-check-input me-3"
                   [checked]="isSelected(row.language)"
                   (click)="$event.stopPropagation(); toggle(row.language)">
            <div class="flex-grow-1">
              <strong>{{ row.language }}</strong>
              <span class="text-muted ms-2">({{ row.count }} samples)</span>
            </div>
          </div>
          <div *ngIf="filteredRows.length === 0" class="list-group-item text-muted">
            No contact languages match.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
