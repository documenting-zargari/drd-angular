<!-- Country Selection Modal — mirrors app-sample-selection's multi-select modal -->
<div class="modal fade" [id]="modalId" tabindex="-1" aria-labelledby="countryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header sticky-top bg-white">
        <h5 class="modal-title" id="countryModalLabel">Choose Countries</h5>
        <button type="button" class="btn btn-secondary ms-auto" data-bs-dismiss="modal">Finished</button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-6">
            <input type="text" class="form-control mb-3" placeholder="Search countries..."
                   [(ngModel)]="searchTerm">
          </div>
        </div>

        <div class="list-group" style="max-height: 400px; overflow-y: auto;">
          <div *ngFor="let row of filteredRows"
               class="list-group-item list-group-item-action d-flex align-items-center"
               (click)="toggle(row.code)" style="cursor: pointer;">
            <input type="checkbox" class="form-check-input me-3"
                   [checked]="isSelected(row.code)"
                   (click)="$event.stopPropagation(); toggle(row.code)">
            <div class="flex-grow-1">
              <span *ngIf="row.flag" class="me-2">{{ row.flag }}</span>
              <strong>{{ row.name }}</strong>
              <span class="text-muted ms-2">({{ row.count }})</span>
            </div>
          </div>
          <div *ngIf="filteredRows.length === 0" class="list-group-item text-muted">
            No countries match.
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
