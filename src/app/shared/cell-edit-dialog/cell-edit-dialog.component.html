<div class="modal fade" [class.show]="show" [style.display]="show ? 'block' : 'none'"
     tabindex="-1" role="dialog" *ngIf="show">
  <div class="modal-dialog modal-sm" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-pencil me-2"></i>Edit Cell
        </h5>
        <button type="button" class="btn-close" (click)="onCancel()"></button>
      </div>
      <div class="modal-body">
        <small class="text-muted d-block mb-2">{{ questionName }}</small>

        <ng-container *ngIf="isMultiField; else singleField">
          <div class="mb-2" *ngFor="let f of fields; let i = index">
            <label class="form-label fw-bold text-capitalize">{{ f.name }}</label>
            <div class="input-group">
              <input type="text" class="form-control" [(ngModel)]="editValues[f.name]"
                     (keyup.enter)="onConfirm()" (keyup.escape)="onCancel()"
                     [attr.autofocus]="i === 0 ? true : null">
              <button *ngIf="editValues[f.name]" class="btn btn-outline-secondary" type="button"
                      (click)="editValues[f.name] = ''" tabindex="-1" title="Clear value">
                <i class="bi bi-x"></i>
              </button>
            </div>
          </div>
        </ng-container>

        <ng-template #singleField>
          <label class="form-label fw-bold text-capitalize">{{ fieldName }}</label>
          <div class="input-group">
            <input type="text" class="form-control" [(ngModel)]="editValue"
                   (keyup.enter)="onConfirm()" (keyup.escape)="onCancel()"
                   autofocus>
            <button *ngIf="editValue" class="btn btn-outline-secondary" type="button"
                    (click)="editValue = ''" tabindex="-1" title="Clear value">
              <i class="bi bi-x"></i>
            </button>
          </div>
        </ng-template>

        <div class="alert alert-warning py-2 mt-3 mb-0" *ngIf="showDeleteConfirm">
          <p class="small mb-2">This deletes the answer to this research question for this sample.</p>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-danger btn-sm" (click)="onDeleteConfirm()">Yes, delete</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="onDeleteCancel()">Cancel</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button *ngIf="canDelete && !showDeleteConfirm" type="button" class="btn btn-outline-danger btn-sm me-auto"
                (click)="onDeleteClick()">Delete entry</button>
        <button type="button" class="btn btn-secondary btn-sm" (click)="onCancel()">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" (click)="onConfirm()" [disabled]="showDeleteConfirm">Save</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="show" *ngIf="show" (click)="onCancel()"></div>
